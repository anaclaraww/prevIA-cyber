# Projeto, containers e portas próprios: sobe ao lado do stack de SOA (citizentech, 8080/5433) sem colidir.
name: previa   # prevIA (o Docker exige minúsculas no nome do projeto)

services:
  postgres:
    image: postgres:17-alpine
    container_name: previa-postgres
    environment:
      POSTGRES_DB: citizentech
      POSTGRES_USER: citizentech
      POSTGRES_PASSWORD: citizentech
    ports:
      - "5434:5432"   # 5434 no host: 5432 é o Postgres local e 5433 o do stack de SOA
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citizentech -d citizentech"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: previa-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=citizentech;Username=citizentech;Password=citizentech"
      Database__AplicarMigrations: "true"
      Database__Seed: "true"
      # Simulador (opcional): SIMULADOR=true CENARIO=ChuvaForte CHUVA_PREVISTA_MM=35 docker compose up -d
      Simulador__Habilitado: "${SIMULADOR:-false}"
      Simulador__Cenario: "${CENARIO:-Normal}"
      Simulador__IntervaloSegundos: "${INTERVALO_SIMULADOR:-20}"
      Simulador__ChuvaPrevistaMm: "${CHUVA_PREVISTA_MM:-}"
      # Tradução dos eventos de segurança pelo Claude. Sem chave, o painel usa os textos offline.
      Privacidade__Ia__ApiKey: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "8081:8080"   # 8081 no host: 8080 é a API do stack de SOA
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
